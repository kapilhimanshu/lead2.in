<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Not Found | Lead2</title>
  <meta name="description" content="The page you are looking for could not be found. Return to Lead2 for B2B demand generation, sales and marketing consulting.">
  <meta name="robots" content="noindex, follow">

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background:
        radial-gradient(circle at 15% 20%, rgba(59,130,246,.10), transparent 32rem),
        radial-gradient(circle at 85% 80%, rgba(16,185,129,.08), transparent 30rem),
        #f7f9fc;
    }

    main {
      width: min(720px, 100%);
      padding: clamp(32px, 6vw, 64px);
      border: 1px solid rgba(23,32,51,.10);
      border-radius: 28px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 24px 70px rgba(23,32,51,.10);
      text-align: center;
    }

    .brand {
      display: inline-block;
      margin-bottom: 34px;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -.03em;
    }

    .code {
      margin: 0 0 12px;
      font-size: clamp(4.5rem, 14vw, 8rem);
      line-height: .9;
      font-weight: 850;
      letter-spacing: -.07em;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      line-height: 1.1;
      letter-spacing: -.04em;
    }

    p {
      max-width: 550px;
      margin: 0 auto 28px;
      color: #5b6475;
      font-size: 1rem;
      line-height: 1.7;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 24px;
      border-radius: 999px;
      color: #fff;
      background: #172033;
      text-decoration: none;
      font-weight: 700;
      transition: transform .2s ease, opacity .2s ease;
    }

    a.button:hover { transform: translateY(-2px); opacity: .92; }
    a.button:focus-visible { outline: 3px solid #60a5fa; outline-offset: 4px; }

    .foot {
      margin-top: 30px;
      margin-bottom: 0;
      font-size: .82rem;
      color: #8a93a3;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">Lead2</div>
    <div class="code" aria-hidden="true">404</div>

    <h1>Page not found</h1>

    <p>
      The page you’re looking for may have moved, been renamed, or no longer exists.
      Return to Lead2 to explore B2B demand generation, sales and marketing consulting.
    </p>

    <a class="button" href="https://www.lead2.in/">Return to Lead2</a>

    <p class="foot">Lead2 · A Xubru Technologies business</p>
  </main>
</body>
</html>
